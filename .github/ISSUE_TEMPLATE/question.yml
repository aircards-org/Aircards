name: Usage question
description: Ask how to use the AirCards website
title: "[Question] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        This form is for questions about the **AirCards website**. Check the [guide](https://aircards.org/en/guide/) and [FAQ](https://aircards.org/en/faq/) first — many answers are there. For AirCard installation, device compatibility, or Wallet changes, use the platform-specific project listed in the guide.

        Please write in English if you can; other languages are welcome. Issues are public. Do not share card numbers, account credentials, or other private information. For account, privacy, security, or artwork correction/removal requests, email contact@aircards.org.
  - type: checkboxes
    id: scope
    attributes:
      label: Before you submit
      options:
        - label: This is about the AirCards website (aircards.org), not installing or running the AirCard app.
          required: true
        - label: I checked the guide, the FAQ, and existing issues.
          required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Where do you need help?
      description: Describe your question and what you have already tried.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Related public page
      description: Optional. Do not paste private or sign-in callback URLs.
  - type: textarea
    id: context
    attributes:
      label: Device or screenshots
      description: Optional. Remove private information from screenshots.
