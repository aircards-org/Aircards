name: Bug report
description: Report a problem with the AirCards website (aircards.org)
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This form is for problems with the **AirCards website** only. For AirCard installation, device compatibility, or Wallet changes, use the platform-specific project listed in our [guide](https://aircards.org/en/guide/).

        Issues are public. Do not share card numbers, account credentials, or other private information. For account, privacy, security, or artwork correction/removal requests, email contact@aircards.org.
  - type: checkboxes
    id: scope
    attributes:
      label: Before you submit
      options:
        - label: This is about the AirCards website (aircards.org), not installing or running the AirCard app.
          required: true
        - label: I searched existing issues and removed private information from this report.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the affected public page URL if useful. Do not paste private or sign-in callback URLs.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: "iPhone, iOS 26, Safari / Mac, macOS 26, Chrome"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or additional context
      description: Optional. Remove private information before attaching images.
